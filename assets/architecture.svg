<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 900" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<rect x="0" y="0" width="1300" height="900" fill="#fcfcfb"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
  </marker>
  <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#4a3aa7"/>
  </marker>
</defs>
<text x="650.0" y="32" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="middle">Confidence-Aware Multi-Teacher Knowledge Distillation — System Overview</text>
<rect x="520.0" y="60" width="260" height="56" rx="10" fill="#ffffff" stroke="#52514e" stroke-width="2"/>
<text x="650" y="83" font-size="15.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Input Image x</text>
<text x="650" y="102" font-size="12" font-weight="500" fill="#52514e" text-anchor="middle">(cue-conflict / OOD sample)</text>
<rect x="60.0" y="150" width="300" height="100" rx="10" fill="#fdf0e9" stroke="#eb6834" stroke-width="2"/>
<text x="210" y="178" font-size="14.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Teacher A — VGG-16 (CNN)</text>
<text x="210" y="200" font-size="14.5" font-weight="600" fill="#eb6834" text-anchor="middle">texture-biased</text>
<text x="210" y="222" font-size="14.5" font-weight="500" fill="#52514e" text-anchor="middle">frozen · pretrained</text>
<rect x="500.0" y="150" width="300" height="100" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
<text x="650" y="178" font-size="14.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Teacher B — ViT-Base/16</text>
<text x="650" y="200" font-size="14.5" font-weight="600" fill="#2a78d6" text-anchor="middle">shape-biased</text>
<text x="650" y="222" font-size="14.5" font-weight="500" fill="#52514e" text-anchor="middle">frozen · pretrained</text>
<rect x="960.0" y="150" width="280" height="100" rx="10" fill="#eeecf9" stroke="#4a3aa7" stroke-width="2"/>
<text x="1100" y="178" font-size="14.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Student — ViT-Small</text>
<text x="1100" y="200" font-size="14.5" font-weight="600" fill="#4a3aa7" text-anchor="middle">14M params, balanced</text>
<text x="1100" y="222" font-size="14.5" font-weight="500" fill="#52514e" text-anchor="middle">trainable</text>
<polyline points="650,116 210,122 210,150" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="650" y1="116" x2="650" y2="150" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="650,116 1100,122 1100,150" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="115.0" y="290" width="190" height="50" rx="10" fill="#ffffff" stroke="#eb6834" stroke-width="2"/>
<text x="210" y="321" font-size="14.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Logits T_A</text>
<rect x="555.0" y="290" width="190" height="50" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
<text x="650" y="321" font-size="14.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Logits T_B</text>
<rect x="1005.0" y="290" width="190" height="50" rx="10" fill="#ffffff" stroke="#4a3aa7" stroke-width="2"/>
<text x="1100" y="321" font-size="14.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Logits S</text>
<line x1="210" y1="250" x2="210" y2="290" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="650" y1="250" x2="650" y2="290" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1100" y1="250" x2="1100" y2="290" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="90.0" y="375" width="240" height="62" rx="10" fill="#fdf0e9" stroke="#eb6834" stroke-width="2"/>
<text x="210" y="400" font-size="14.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Softmax → P_A</text>
<text x="210" y="420" font-size="14.5" font-weight="600" fill="#52514e" text-anchor="middle">Entropy H(P_A)</text>
<rect x="530.0" y="375" width="240" height="62" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
<text x="650" y="400" font-size="14.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Softmax → P_B</text>
<text x="650" y="420" font-size="14.5" font-weight="600" fill="#52514e" text-anchor="middle">Entropy H(P_B)</text>
<line x1="210" y1="340" x2="210" y2="375" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="650" y1="340" x2="650" y2="375" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="80.0" y="467" width="260" height="62" rx="10" fill="#ffffff" stroke="#eb6834" stroke-width="2"/>
<text x="210" y="492" font-size="14.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Confidence_A = 1 / (H_A+ε)</text>
<text x="210" y="512" font-size="14.5" font-weight="600" fill="#52514e" text-anchor="middle">normalize → w_A</text>
<rect x="520.0" y="467" width="260" height="62" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
<text x="650" y="492" font-size="14.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Confidence_B = 1 / (H_B+ε)</text>
<text x="650" y="512" font-size="14.5" font-weight="600" fill="#52514e" text-anchor="middle">normalize → w_B</text>
<line x1="210" y1="437" x2="210" y2="467" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="650" y1="437" x2="650" y2="467" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="190.0" y="567" width="480" height="72" rx="10" fill="#f4f3f1" stroke="#52514e" stroke-width="2"/>
<text x="430.0" y="595" font-size="14.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Confidence-Weighted Ensemble</text>
<text x="430.0" y="617" font-size="14.5" font-weight="600" fill="#52514e" text-anchor="middle">T_ensemble = w_A·T_A + w_B·T_B</text>
<polyline points="210,529 210,547 350.0,567" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="650,529 650,547 510.0,567" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1100" y1="340" x2="1100" y2="605" stroke="#52514e" stroke-width="2"/>
<rect x="550.0" y="690" width="420" height="74" rx="10" fill="#ffffff" stroke="#52514e" stroke-width="2"/>
<text x="760" y="716" font-size="14.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">KD Loss  L_distill</text>
<text x="760" y="737" font-size="14.5" font-weight="550" fill="#52514e" text-anchor="middle">KL( softmax(S/Ts), softmax(T_ensemble/Tt) )·Ts²</text>
<rect x="990.0" y="690" width="260" height="74" rx="10" fill="#ffffff" stroke="#52514e" stroke-width="2"/>
<text x="1120" y="716" font-size="14.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Cross-Entropy  L_CE</text>
<text x="1120" y="737" font-size="14.5" font-weight="550" fill="#52514e" text-anchor="middle">−Σ yᵢ log(pᵢ)</text>
<rect x="1010.0" y="567" width="220" height="50" rx="10" fill="#ffffff" stroke="#52514e" stroke-width="2" stroke-dasharray="4,3"/>
<text x="1120" y="598" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Ground-truth label y</text>
<line x1="1120" y1="617" x2="1120" y2="690" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="430.0,639 430.0,665 640,690" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1100,605 880,645 880,690" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1100" y1="605" x2="1100" y2="690" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="1100" cy="605" r="3.5" fill="#52514e"/>
<rect x="690.0" y="804" width="500" height="62" rx="10" fill="#eeecf9" stroke="#4a3aa7" stroke-width="2"/>
<text x="940" y="830" font-size="14.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Total Loss</text>
<text x="940" y="852" font-size="14.5" font-weight="600" fill="#4a3aa7" text-anchor="middle">L_total = (1−α)·L_CE + α·L_distill</text>
<polyline points="760,764 760,786 850,804" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1120,764 1120,786 1030,804" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1190.0,835.0 1270,835.0 1270,200.0 1240.0,200.0" fill="none" stroke="#4a3aa7" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowDash)"/>
<text x="1262" y="502.0" font-size="13" font-weight="700" fill="#4a3aa7" text-anchor="end">backprop</text>
<text x="1262" y="520.0" font-size="11.5" font-weight="500" fill="#4a3aa7" text-anchor="end">(updates θ_student only)</text>
<rect x="40" y="800" width="16" height="16" rx="3" fill="#eb6834"/>
<text x="64" y="813" font-size="12.5" font-weight="500" fill="#52514e" text-anchor="start">Texture-biased teacher (CNN)</text>
<rect x="40" y="822" width="16" height="16" rx="3" fill="#2a78d6"/>
<text x="64" y="835" font-size="12.5" font-weight="500" fill="#52514e" text-anchor="start">Shape-biased teacher (ViT)</text>
<rect x="40" y="844" width="16" height="16" rx="3" fill="#4a3aa7"/>
<text x="64" y="857" font-size="12.5" font-weight="500" fill="#52514e" text-anchor="start">Trainable student</text>
<rect x="40" y="866" width="16" height="16" rx="3" fill="#52514e"/>
<text x="64" y="879" font-size="12.5" font-weight="500" fill="#52514e" text-anchor="start">Loss / aggregation</text>
</svg>